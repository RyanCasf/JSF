<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">
	
	<ui:composition template="/template/padrao.xhtml">
		<ui:define name="titulo">Confirm Popup</ui:define>
		
		<ui:define name="conteudo">
			<h:form id="formConfirmPopup">
				<div class="ui-fluid">
					<p:growl severity="info" showDetail="true"/>
					
					<p:commandButton
						value="Popup"
						process="@this"
						style="width:120px"
						onclick="dlg.show()"
						oncomplete="dlg.hide()"
						actionListener="#{confirmPopupBean.confirm}">
						
						<p:confirm type="popup" header="Confirmação" message="Você tem certeza que deseja fazer o processo?"/>
					</p:commandButton>
				</div>
			</h:form>
		</ui:define>
	</ui:composition>
</html>

<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">
	
	<ui:composition template="/template/padrao.xhtml">
		<ui:define name="titulo">InputGroup</ui:define>
		
		<ui:define name="conteudo">
			<h:form id="formInputGroup">
				<p:growl severity="info" showDetail="true"/>
				
				<div class="ui-inputgroup">
					<p:selectBooleanButton
						onLabel="%"
						offLabel="%"
						value="#{inputGroupBean.texto.matchModeStart}"
					/>
					
					<p:inputText
						placeholder="Texto..."
						value="#{inputGroupBean.texto.value}"
					/>
					
					<p:selectBooleanButton
						onLabel="%"
						offLabel="%"
						value="#{inputGroupBean.texto.matchModeEnd}"
					/>
				</div>
				
				<p:separator/>
				
				<p:commandButton
					value="Enviar"
					update="@form"
					process="@form"
					actionListener="#{inputGroupBean.enviar}"
				/>
			</h:form>
		</ui:define>
	</ui:composition>
</html>

<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">
	
	<ui:composition>
		<p:dialog
			modal="true"
			closable="false"
			widgetVar="dlgAsync"
			header="Executando Tarefa">
			
			<h:form id="formAsync">
				<p:poll
					interval="5"
					autoStart="false"
					widgetVar="pollAsync"
					listener="#{asyncSchedule.verificar}"
		        />
		        
				<h:outputText value="Processo em andamento"/>
			</h:form>
	    </p:dialog>
	    
	    <p:dialog
			modal="true"
			header="Pronto"
			widgetVar="dlgAsyncPronto">
			
			<h:form id="formAsyncPronto">
		        <p:commandButton
					ajax="false"
					value="Download"
					onclick="PrimeFaces.monitorDownload(monitorDownloadStart, monitorDownloadStop)">
					
					<p:fileDownload value="#{asyncSchedule.negocio.task.conteudo}"/>
				</p:commandButton>
			</h:form>
	    </p:dialog>
	    
	    <p:dialog
			modal="true"
			header="Erro"
			widgetVar="dlgAsyncErro">
			
			<h:outputText value="Algo deu errado no método assíncrono!"/>
	    </p:dialog>
	</ui:composition>
</html>
